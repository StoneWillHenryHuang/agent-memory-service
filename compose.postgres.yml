services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${PME_POSTGRES_DB:-portable_memory}
      POSTGRES_USER: ${PME_POSTGRES_USER:-portable_memory}
      POSTGRES_PASSWORD: ${PME_POSTGRES_PASSWORD:?PME_POSTGRES_PASSWORD must be set}
    ports:
      - "${PME_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
