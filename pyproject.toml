[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "portable-memory-engine"
version = "0.1.0.dev0"
description = "An async-first, provider-neutral long-term memory engine for Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
postgres = [
  "SQLAlchemy[asyncio]>=2.0.51,<3",
  "alembic>=1.18.5,<2",
  "pgvector>=0.5,<1",
  "psycopg[binary]>=3.3.4,<4",
]
openai-compatible = [
  "httpx>=0.28.1,<1",
]
google-vertex = [
  "google-auth>=2.56,<3",
  "google-genai>=2.16,<3",
  "httpx>=0.28.1,<1",
]
fastapi = [
  "fastapi>=0.141.1,<1",
  "pydantic>=2.12.5,<3",
  "uvicorn>=0.52,<1",
]
mcp = [
  "mcp>=2.0,<3",
  "pydantic>=2.12.5,<3",
]
contract-tests = [
  "pytest>=9.1,<10",
]
dev = [
  "SQLAlchemy[asyncio]>=2.0.51,<3",
  "alembic>=1.18.5,<2",
  "build>=1.5,<2",
  "fastapi>=0.141.1,<1",
  "hatchling>=1.31,<2",
  "google-genai>=2.16,<3",
  "httpx>=0.28.1,<1",
  "import-linter>=2.13,<3",
  "mypy>=2.3,<3",
  "mcp>=2.0,<3",
  "pgvector>=0.5,<1",
  "pydantic>=2.12.5,<3",
  "psycopg[binary]>=3.3.4,<4",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.15.22,<1",
  "uvicorn>=0.52,<1",
]

[tool.hatch.build]
exclude = [
  "/.github",
  "/.open_source_extraction",
  "/.git",
  "/EXTRACTION_STATUS.md",
  "/tests",
  "/tools",
]

[tool.hatch.build.targets.wheel]
packages = ["src/portable_memory_engine"]

[tool.hatch.build.targets.sdist]
include = [
  "/.dockerignore",
  "/compose.postgres.yml",
  "/src",
  "/docs",
  "/examples",
  "/README.md",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "T20"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["T201"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "tools"]
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=portable_memory_engine",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]
markers = [
  "postgres: requires PME_TEST_DATABASE_URL pointing to a disposable PostgreSQL database",
]

[tool.coverage.run]
branch = true
source = ["portable_memory_engine"]
omit = [
  "src/portable_memory_engine/adapters/postgres/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "portable_memory_engine"
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "core-layers"
name = "Core layers depend inward"
type = "layers"
containers = ["portable_memory_engine"]
layers = ["(application)", "(ports)", "(domain)"]
